name: Build TrollAppScanner tipa

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

jobs:
  build:
    # 不要用 macos-latest：它已升到 macOS 26 + iOS 26 SDK。
    # 用 iOS 26 SDK 编出来的二进制跑在 iOS 14~18 上会因 Swift/SwiftUI 符号缺失
    # 在 dyld 阶段直接闪退（实测本工程踩过）。macos-15 默认带 Xcode 16。
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - name: 取出源码
        uses: actions/checkout@v4

      - name: 选择 Xcode 并校验 SDK 版本
        run: |
          set -e
          echo "---- runner 上的 Xcode ----"
          ls -d /Applications/Xcode*.app 2>/dev/null || true

          # 优先挑 16.x（iOS 18 SDK），没有则退回默认
          PICK="$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1 || true)"
          if [ -n "$PICK" ]; then
            echo "选用: $PICK"
            sudo xcode-select -s "$PICK"
          else
            echo "未找到 Xcode_16*.app，沿用默认工具链"
          fi

          xcodebuild -version
          SDK_VER="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "iOS SDK: $SDK_VER"

          SDK_MAJOR="${SDK_VER%%.*}"
          if [ "$SDK_MAJOR" -gt 18 ]; then
            echo "::error::iOS SDK $SDK_VER 过新。用高于 18 的 SDK 编出面向 iOS 14 的包，"
            echo "::error::会在老设备上 dyld 报 Symbol not found 直接闪退。请换 macos-15 或更低镜像。"
            exit 1
          fi
          echo "SDK 版本检查通过（<= 18）"

      - name: 显示工具链
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          echo "swift-stdlib-tool: $(command -v xcrun) ok"

      - name: 安装 ldid（必需）
        run: |
          brew install ldid
          ldid --version || true
          command -v ldid

      - name: 编译并打包
        run: |
          # Git for Windows 可能把换行写成 CRLF，这里兜底去掉
          sed -i '' 's/\r$//' build.sh 2>/dev/null || sed -i 's/\r$//' build.sh
          chmod +x build.sh
          ./build.sh

      - name: 校验产物
        run: |
          set -e
          [ -f AppScanner.tipa ] || { echo "没有产出主包"; exit 1; }
          [ -f AppScanner-Probe.tipa ] || { echo "没有产出探针包"; exit 1; }
          ls -lh AppScanner.tipa AppScanner-Probe.tipa

          rm -rf /tmp/verify && mkdir -p /tmp/verify
          unzip -q AppScanner.tipa -d /tmp/verify
          BIN=/tmp/verify/Payload/AppScanner.app/AppScanner
          PLIST=/tmp/verify/Payload/AppScanner.app/Info.plist

          echo "---- 主二进制架构 ----"
          lipo -info "$BIN"

          echo "---- 编译 SDK / 最低系统 ----"
          otool -l "$BIN" | grep -A4 LC_BUILD_VERSION || true
          MINOS="$(otool -l "$BIN" | awk '/LC_BUILD_VERSION/{f=1} f&&/minos/{print $2; exit}')"
          echo "minos=$MINOS"
          [ -n "$MINOS" ] || { echo "::error::读不到 minos"; exit 1; }
          [ "${MINOS%%.*}" -le 16 ] || { echo "::error::minos $MINOS 高于 iOS 16.3.1"; exit 1; }

          echo "---- Info.plist 关键项 ----"
          if plutil -convert xml1 -o - "$PLIST" 2>/dev/null | grep -q "UIApplicationSceneManifest"; then
            echo "::error::Info.plist 里还残留 UIApplicationSceneManifest，AppDelegate 自建的 window 不会显示（白屏）"
            exit 1
          fi
          echo "无 SceneManifest（走 legacy AppDelegate 路径）"

          echo "---- 主二进制 entitlements ----"
          ldid -e "$BIN" | tee /tmp/ent.txt
          grep -q "no-sandbox" /tmp/ent.txt
          grep -q "platform-application" /tmp/ent.txt
          if grep -q "get-task-allow" /tmp/ent.txt; then
            echo "::error::entitlements 里还有 get-task-allow，TrollStore 上会被 AMFI 在 exec 阶段杀掉（白屏闪退）"
            exit 1
          fi
          echo "entitlements 校验通过（含 no-sandbox / platform-application，无 get-task-allow）"

          echo "---- 探针包 Info.plist ----"
          rm -rf /tmp/verifyp && mkdir -p /tmp/verifyp
          unzip -q AppScanner-Probe.tipa -d /tmp/verifyp
          plutil -convert xml1 -o - /tmp/verifyp/Payload/AppScannerProbe.app/Info.plist | grep -A1 "TASProbe"
          ldid -e /tmp/verifyp/Payload/AppScannerProbe.app/AppScanner | grep -q "no-sandbox"
          echo "探针包校验通过"

          shasum -a 256 AppScanner.tipa AppScanner-Probe.tipa | tee AppScanner.tipa.sha256

      - name: 上传 tipa
        uses: actions/upload-artifact@v4
        with:
          name: TrollAppScanner-tipa
          path: |
            AppScanner.tipa
            AppScanner-Probe.tipa
            AppScanner.tipa.sha256
          if-no-files-found: error
          retention-days: 30
